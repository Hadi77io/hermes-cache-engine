<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-label="hermes-cache-engine — clip the tail, keep the cache">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#141033"/>
      <stop offset="100%" stop-color="#0a1a2f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="keep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="cut" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#fb7185" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="280" rx="20" fill="url(#bg)"/>
  <circle cx="905" cy="52" r="120" fill="#7c3aed" opacity="0.18" filter="url(#glow)"/>
  <circle cx="120" cy="250" r="110" fill="#22d3ee" opacity="0.12" filter="url(#glow)"/>

  <text x="52" y="86" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial" font-size="15" letter-spacing="4" fill="#8b9dc3">HERMES AGENT PLUGIN</text>

  <text x="50" y="146" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial" font-size="52" font-weight="700" fill="#ffffff">hermes<tspan fill="#a78bfa">-cache</tspan><tspan fill="#22d3ee">-engine</tspan></text>

  <text x="52" y="184" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial" font-size="19" fill="#b6c2d9">Clip the tail. Keep the cache. Measure every request.</text>

  <g transform="translate(52,214)">
    <rect x="0" y="0" width="380" height="26" rx="7" fill="url(#keep)" opacity="0.9"/>
    <text x="14" y="18" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#04222b">cached prefix — byte-stable</text>
    <rect x="388" y="0" width="120" height="26" rx="7" fill="#1e293b" stroke="#475569" stroke-dasharray="4 4"/>
    <text x="400" y="18" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#64748b">tail</text>
    <rect x="516" y="0" width="380" height="26" rx="7" fill="url(#cut)"/>
    <text x="528" y="18" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#fbcfe8">clipped middle → pointer line</text>
  </g>

  <rect x="0" y="276" width="1000" height="4" fill="url(#accent)"/>
</svg>
