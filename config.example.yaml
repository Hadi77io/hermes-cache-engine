# Add to ~/.hermes/config.yaml (or /opt/data/config.yaml for a server install)
plugins:
  enabled:
    - hermes-cache-engine

cache_engine:
  mode: report        # report = measure only (safe) | enforce = clip for real
  default_cap: 1200   # tokens kept per tool result
  hard_cap: 6000
  head_ratio: 0.6     # 60% head + 40% tail
  per_tool:
    web_extract: 900
    skill_view: 900
    session_search: 900
    memory_recall: 900
    read_file: 2000
